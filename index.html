<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geoplatform</title>
  </head>
  <body>
    <!-- three regions around the map (spec 035); ids are kept from the old sidebar -->
    <header id="topbar">
      <h1>Geoplatform</h1>
      <label class="file">Open GeoTIFF <input id="open-raster" type="file" accept=".tif,.tiff,image/tiff" /></label>
      <span id="raster-info"></span>
      <span id="file-actions" hidden>
        <label class="file">Import labels <input id="import-labels" type="file" accept=".tif,.tiff,image/tiff" /></label>
        <label class="file">Apply class map <input id="class-map" type="file" accept=".json,application/json" /></label>
        <button id="export-labels" type="button">Export labels</button>
      </span>
      <button id="help-button" type="button" aria-label="Shortcuts" title="Shortcuts (?)">?</button>
    </header>
    <nav id="tools" hidden aria-label="Tools">
      <div id="brush-panel">
        <button id="mode-pan" type="button" aria-pressed="true" aria-label="Pan" title="Pan (P)">&#x2725;</button>
        <button id="mode-paint" type="button" aria-pressed="false" aria-label="Paint" title="Paint (B)">&#x270E;</button>
        <button id="mode-erase" type="button" aria-pressed="false" aria-label="Erase" title="Erase (E)">&#x232B;</button>
        <button id="mode-fill" type="button" aria-pressed="false" aria-label="Fill" title="Fill (F)">&#x25A7;</button>
        <button id="mode-smart" type="button" aria-pressed="false" aria-label="Smart select" title="Smart select (M)">&#x2316;</button>
        <button id="smart-apply" type="button" disabled aria-label="Apply smart selection" title="Apply smart selection (Enter)">&#x2713;</button>
        <hr />
        <button id="brush-smaller" type="button" aria-label="Smaller brush" title="Smaller brush ([)">&minus;</button>
        <span id="brush-size" title="Brush size in raster pixels">7</span>
        <button id="brush-larger" type="button" aria-label="Larger brush" title="Larger brush (])">+</button>
        <input id="brush-size-range" type="range" min="1" max="127" step="2" value="7" aria-label="Brush size" />
        <hr />
        <button id="undo" type="button" disabled aria-label="Undo" title="Undo (Ctrl+Z)">&#x21B6;</button>
        <button id="redo" type="button" disabled aria-label="Redo" title="Redo (Ctrl+Shift+Z)">&#x21B7;</button>
      </div>
    </nav>
    <main id="map"></main>
    <!-- the shortcut list (spec 039), filled from ui/shortcuts.ts -->
    <dialog id="help" aria-labelledby="help-title">
      <h2 id="help-title">Shortcuts</h2>
      <div id="help-list"></div>
      <form method="dialog"><button type="submit">Close</button></form>
    </dialog>
    <aside id="side" hidden>
      <div id="panel">
        <section id="class-section">
          <div class="section-head"><h2>Classes</h2><button id="class-add" type="button">Add class</button></div>
          <ul id="classes"></ul>
        </section>
        <section id="label-section">
          <h2>Labels</h2>
          <label><input id="show-labels" type="checkbox" checked /> Show (H)</label>
          <div class="row">
            <input id="label-opacity" type="range" min="0" max="100" step="5" value="60" aria-label="Opacity" />
            <span id="label-opacity-text">60%</span>
          </div>
        </section>
      </div>
    </aside>
    <footer id="status">
      <span id="status-lonlat"></span>
      <span id="status-px"></span>
      <span id="status-zoom"></span>
      <span id="status-tool"></span>
      <span id="save-state"></span>
      <span id="message" role="status" aria-live="polite"></span>
      <progress id="open-progress" hidden></progress>
      <button id="smart-cancel" type="button" hidden>Cancel</button>
      <progress id="import-progress" hidden></progress>
      <button id="import-cancel" type="button" hidden>Cancel</button>
    </footer>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
